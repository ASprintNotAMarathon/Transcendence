<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg-glow" cx="15%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#B23A2E" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#B23A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="640" fill="#0A0B0D"/>
  <rect width="900" height="640" fill="url(#bg-glow)"/>

  <!-- Title -->
  <text x="40" y="56" font-size="30" font-weight="700" fill="#ECE7DE">GOMOKU FRIENDS</text>
  <text x="40" y="80" font-size="13" fill="#ECE7DE" fill-opacity="0.6">daisyUI theme "gomoku" — style guide</text>

  <!-- Color palette -->
  <text x="40" y="128" font-size="14" font-weight="600" fill="#ECE7DE" letter-spacing="1">COLOR TOKENS</text>

  <!-- primary -->
  <rect x="40" y="144" width="150" height="90" rx="10" fill="#B23A2E"/>
  <text x="50" y="220" font-size="12" fill="#ECE7DE">--color-primary</text>
  <text x="50" y="234" font-size="11" fill="#ECE7DE" fill-opacity="0.7">#B23A2E</text>

  <!-- primary-content -->
  <rect x="200" y="144" width="150" height="90" rx="10" fill="#ECE7DE"/>
  <text x="210" y="220" font-size="12" fill="#14161B">--color-primary-content</text>
  <text x="210" y="234" font-size="11" fill="#14161B" fill-opacity="0.7">#ECE7DE</text>

  <!-- secondary -->
  <rect x="360" y="144" width="150" height="90" rx="10" fill="#C9D6B5"/>
  <text x="370" y="220" font-size="12" fill="#14161B">--color-secondary</text>
  <text x="370" y="234" font-size="11" fill="#14161B" fill-opacity="0.7">#C9D6B5</text>

  <!-- base-100 -->
  <rect x="520" y="144" width="150" height="90" rx="10" fill="#14161B" stroke="#3A3D45" stroke-width="1"/>
  <text x="530" y="220" font-size="12" fill="#ECE7DE">--color-base-100</text>
  <text x="530" y="234" font-size="11" fill="#ECE7DE" fill-opacity="0.7">#14161B</text>

  <!-- base-200 -->
  <rect x="680" y="144" width="150" height="90" rx="10" fill="#0A0B0D" stroke="#3A3D45" stroke-width="1"/>
  <text x="690" y="220" font-size="12" fill="#ECE7DE">--color-base-200</text>
  <text x="690" y="234" font-size="11" fill="#ECE7DE" fill-opacity="0.7">#0A0B0D</text>

  <!-- Typography -->
  <text x="40" y="284" font-size="14" font-weight="600" fill="#ECE7DE" letter-spacing="1">TYPOGRAPHY</text>

  <rect x="40" y="300" width="390" height="90" rx="10" fill="#14161B" stroke="#3A3D45" stroke-width="1"/>
  <text x="60" y="345" font-size="30" font-weight="700" fill="#ECE7DE">GOMOKU</text>
  <text x="60" y="378" font-size="12" fill="#ECE7DE" fill-opacity="0.6">Barrio — display / headings (.font-barrio)</text>

  <rect x="440" y="300" width="390" height="90" rx="10" fill="#14161B" stroke="#3A3D45" stroke-width="1"/>
  <text x="460" y="345" font-size="20" fill="#ECE7DE">Five in a row, live.</text>
  <text x="460" y="378" font-size="12" fill="#ECE7DE" fill-opacity="0.6">Valley Sans — body text (default on body)</text>

  <!-- Buttons -->
  <text x="40" y="440" font-size="14" font-weight="600" fill="#ECE7DE" letter-spacing="1">BUTTON — .btn-outline-accent</text>

  <!-- rest state -->
  <rect x="40" y="456" width="160" height="48" rx="24" fill="none" stroke="#B23A2E" stroke-width="2"/>
  <text x="120" y="485" font-size="14" fill="#ECE7DE" text-anchor="middle" font-weight="600" letter-spacing="0.5">Start playing</text>
  <text x="40" y="522" font-size="11" fill="#ECE7DE" fill-opacity="0.6">Rest</text>

  <!-- hover state -->
  <rect x="240" y="456" width="160" height="48" rx="24" fill="#B23A2E"/>
  <text x="320" y="485" font-size="14" fill="#ECE7DE" text-anchor="middle" font-weight="600" letter-spacing="0.5">Start playing</text>
  <text x="240" y="522" font-size="11" fill="#ECE7DE" fill-opacity="0.6">Hover</text>

  <!-- radius note -->
  <text x="460" y="485" font-size="12" fill="#ECE7DE" fill-opacity="0.7">--radius-field: 9999px (pill shape)</text>

  <!-- Footer -->
  <line x1="40" y1="560" x2="860" y2="560" stroke="#3A3D45" stroke-width="1"/>
  <text x="40" y="586" font-size="11" fill="#ECE7DE" fill-opacity="0.5">Defined in apps/web/src/index.css — @plugin "daisyui/theme" block.</text>
  <text x="40" y="604" font-size="11" fill="#ECE7DE" fill-opacity="0.5">Custom classes (.btn-outline-accent, .text-muted) reference these tokens rather than hardcoding hex values.</text>
</svg>
