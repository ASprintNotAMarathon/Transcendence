events {}

http {
	server {
		listen 443 ssl;
		server_name localhost;

		ssl_certificate		/etc/nginx/certs/localhost.crt;
		ssl_certificate_key	/etc/nginx/certs/localhost.key;

		location /api/ {
			proxy_pass http://api:3000;

			proxy_set_header Host				$host;
			proxy_set_header X-Real-IP			$remote_addr;
			proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto	$scheme;
		}

		location /ws/ {
			proxy_pass http://api:3000;

			# The upgrade only exists in HTTP/1.1, and nginx drops these two
			# headers unless told to pass them on.
			proxy_http_version 1.1;
			proxy_set_header Upgrade	$http_upgrade;
			proxy_set_header Connection	"upgrade";

			proxy_set_header Host				$host;
			proxy_set_header X-Real-IP			$remote_addr;
			proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto	$scheme;

			# nginx closes a proxied connection after 60s of silence. The api
			# pings every 10s, so this is only a safety margin.
			proxy_read_timeout 1h;
		}

		location / {
			default_type text/plain;
			return 200 "nginx is up and speaking https\n";
		}
	}

	server {
		listen 80;
		server_name localhost;
		return 301 https://$host$request_uri;
	}
}