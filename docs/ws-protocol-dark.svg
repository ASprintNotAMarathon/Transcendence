<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
     role="img" aria-label="Match payload interfaces are wrapped by the Envelope generic into MatchClientEvent, which combines with the empty LifecycleClientEvent and ChatClientEvent to form ClientEvent. The server payloads follow the mirrored path into ServerEvent.">

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5A68"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7C8B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#0D1117"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="500"
     letter-spacing="1.1" fill="#8697A6">
    <text x="0" y="16">PAYLOAD INTERFACES</text>
    <text x="250" y="16">WRAPPED</text>
    <text x="440" y="16">PER-DOMAIN UNION</text>
    <text x="720" y="16">IMPORTED</text>
  </g>

  <!-- ============ CLIENT ============ -->
  <text x="0" y="48" font-size="12" fill="#5FADDD">Client to server</text>

  <g fill="#0D1117" stroke="#3A4956" stroke-width="1.2">
    <rect x="0" y="60"  width="180" height="30" rx="3"/>
    <rect x="0" y="96"  width="180" height="30" rx="3"/>
    <rect x="0" y="132" width="180" height="30" rx="3"/>
    <rect x="0" y="168" width="180" height="30" rx="3"/>
  </g>
  <g font-size="12" fill="#E4EBF1">
    <text x="12" y="79">MatchJoinPayload</text>
    <text x="12" y="115">MatchLeavePayload</text>
    <text x="12" y="151">MatchMovePayload</text>
    <text x="12" y="187">MatchResignPayload</text>
  </g>

  <g stroke="#3A4956" stroke-width="1.2" fill="none">
    <path d="M180 75  L214 75  L214 123 L244 123" marker-end="url(#a)"/>
    <path d="M180 111 L214 111"/>
    <path d="M180 147 L214 147"/>
    <path d="M180 183 L214 183 L214 123"/>
  </g>

  <rect x="250" y="60" width="150" height="138" rx="3" fill="#0D1117" stroke="#3A4956" stroke-width="1.2"/>
  <text x="325" y="117" font-size="12" fill="#E4EBF1" text-anchor="middle">Envelope</text>
  <text x="325" y="135" font-size="11" fill="#8697A6" text-anchor="middle">&lt;"match.join", …&gt;</text>

  <path d="M400 129 L434 129" stroke="#3A4956" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="440" y="48"  width="200" height="30" rx="3" fill="none" stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="452" y="67" font-size="12" fill="#6B7C8B">LifecycleClientEvent</text>

  <rect x="440" y="114" width="200" height="30" rx="3" fill="#16303F" stroke="#5FADDD" stroke-width="1.2"/>
  <text x="452" y="133" font-size="12" fill="#5FADDD">MatchClientEvent</text>

  <rect x="440" y="180" width="200" height="30" rx="3" fill="none" stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="452" y="199" font-size="12" fill="#6B7C8B">ChatClientEvent</text>

  <g stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M640 63  L676 63  L676 129 L714 129" marker-end="url(#n)"/>
    <path d="M640 195 L676 195 L676 129"/>
  </g>
  <path d="M640 129 L714 129" stroke="#3A4956" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="720" y="112" width="170" height="34" rx="3" fill="#16303F" stroke="#5FADDD" stroke-width="1.2"/>
  <text x="805" y="134" font-size="12" fill="#5FADDD" text-anchor="middle">ClientEvent</text>

  <line x1="0" y1="240" x2="900" y2="240" stroke="#28343F" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- ============ SERVER ============ -->
  <text x="0" y="282" font-size="12" fill="#E08A55">Server to client</text>

  <g fill="#0D1117" stroke="#3A4956" stroke-width="1.2">
    <rect x="0" y="294" width="180" height="30" rx="3"/>
    <rect x="0" y="330" width="180" height="30" rx="3"/>
    <rect x="0" y="366" width="180" height="30" rx="3"/>
  </g>
  <g font-size="12" fill="#E4EBF1">
    <text x="12" y="313">MatchStatePayload</text>
    <text x="12" y="349">MatchMovedPayload</text>
    <text x="12" y="385">MatchRejectedPayload</text>
  </g>

  <g stroke="#3A4956" stroke-width="1.2" fill="none">
    <path d="M180 309 L214 309 L214 345 L244 345" marker-end="url(#a)"/>
    <path d="M180 345 L214 345"/>
    <path d="M180 381 L214 381 L214 345"/>
  </g>

  <rect x="250" y="294" width="150" height="102" rx="3" fill="#0D1117" stroke="#3A4956" stroke-width="1.2"/>
  <text x="325" y="339" font-size="12" fill="#E4EBF1" text-anchor="middle">Envelope</text>
  <text x="325" y="357" font-size="11" fill="#8697A6" text-anchor="middle">&lt;"match.state", …&gt;</text>

  <path d="M400 345 L434 345" stroke="#3A4956" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="440" y="274" width="200" height="30" rx="3" fill="none" stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="452" y="293" font-size="12" fill="#6B7C8B">LifecycleServerEvent</text>

  <rect x="440" y="330" width="200" height="30" rx="3" fill="#3A2416" stroke="#E08A55" stroke-width="1.2"/>
  <text x="452" y="349" font-size="12" fill="#E08A55">MatchServerEvent</text>

  <rect x="440" y="386" width="200" height="30" rx="3" fill="none" stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="452" y="405" font-size="12" fill="#6B7C8B">ChatServerEvent</text>

  <g stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M640 289 L676 289 L676 345 L714 345" marker-end="url(#n)"/>
    <path d="M640 401 L676 401 L676 345"/>
  </g>
  <path d="M640 345 L714 345" stroke="#3A4956" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="720" y="328" width="170" height="34" rx="3" fill="#3A2416" stroke="#E08A55" stroke-width="1.2"/>
  <text x="805" y="350" font-size="12" fill="#E08A55" text-anchor="middle">ServerEvent</text>

  <!-- legend -->
  <line x1="0" y1="436" x2="900" y2="436" stroke="#28343F" stroke-width="1.2"/>
  <rect x="0" y="450" width="26" height="14" rx="2" fill="none" stroke="#6B7C8B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="36" y="461" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8697A6">dashed = never, nothing written yet</text>
</svg>
